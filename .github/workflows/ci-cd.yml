name: CI/CD Pipeline & Hugging Face Sync

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================================
  # 1. Continuous Integration: Test & Code Quality
  # =========================================================================
  test:
    name: Run Automated Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLP Corpora
        run: |
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"

      - name: Execute Unit & Integration Tests
        run: |
          python -m unittest discover -s tests -v

  # =========================================================================
  # 2. Continuous Deployment: Auto-Sync to Hugging Face Spaces
  # =========================================================================
  deploy-huggingface:
    name: Sync to Hugging Face Spaces
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_URL" ]; then
            echo "::notice::HF_TOKEN atau HF_SPACE_URL belum di-set di GitHub Secrets. Melewati tahap auto-sync Hugging Face."
            echo "Untuk mengaktifkan auto-deploy: tambahkan secret HF_TOKEN & HF_SPACE_URL di Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Syncing repository to Hugging Face Space: $HF_SPACE_URL..."
          git push --force "https://user:$HF_TOKEN@$HF_SPACE_URL" main:main
